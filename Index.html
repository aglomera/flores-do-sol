<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>Para Você 🌻</title>
<style>
  :root{
    --sky-top:#241a3d;
    --sky-mid:#4b3576;
    --sky-bottom:#8b5fa8;
    --ground:#4a7c59;
    --ground-dark:#2f5138;
    --dirt:#6b4a34;
    --sun:#ffcb47;
    --petal:#f4a300;
    --pink:#ff8fab;
    --cream:#fff8e7;
  }
  *{ box-sizing:border-box; }
  html,body{
    margin:0;
    height:100%;
    overflow:hidden;
    background:linear-gradient(var(--sky-top), var(--sky-bottom));
  }
  body{
    position:fixed;
    inset:0;
    font-family:'Courier New', monospace;
    color:var(--cream);
  }

  /* title / subtitle now float over the top of the game instead of pushing it down */
  h1{
    position:fixed;
    top:calc(8px + env(safe-area-inset-top,0px));
    left:0; right:0;
    font-size:.65rem;
    letter-spacing:2px;
    text-transform:uppercase;
    opacity:.75;
    margin:0;
    text-align:center;
    z-index:5;
    pointer-events:none;
    text-shadow:0 1px 5px rgba(0,0,0,.65);
  }
  #subtitle{
    position:fixed;
    top:calc(24px + env(safe-area-inset-top,0px));
    left:0; right:0;
    font-size:.6rem;
    opacity:.6;
    text-align:center;
    letter-spacing:.5px;
    z-index:5;
    pointer-events:none;
    text-shadow:0 1px 5px rgba(0,0,0,.65);
  }

  #gameWrap{
    position:fixed;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  canvas{
    display:block;
    width:auto;
    height:auto;
    max-width:100vw;
    max-height:100vh;
    max-height:100dvh;
    aspect-ratio:800/400;
    margin:0 auto;
    image-rendering:pixelated;
  }

  #hearts{
    position:fixed;
    top:calc(8px + env(safe-area-inset-top,0px));
    right:calc(10px + env(safe-area-inset-right,0px));
    font-size:.7rem;
    letter-spacing:2px;
    opacity:.75;
    z-index:5;
    pointer-events:none;
    text-shadow:0 1px 5px rgba(0,0,0,.65);
  }

  /* controls: small, floating, thumb-reach corners */
  #touchControls{ position:static; }
  #dpad{ display:contents; }
  .tbtn{
    position:fixed;
    bottom:calc(16px + env(safe-area-inset-bottom,0px));
    width:50px;
    height:50px;
    border-radius:50%;
    background:rgba(255,255,255,.10);
    border:1.5px solid rgba(255,255,255,.32);
    color:var(--cream);
    font-size:1.05rem;
    display:flex;
    align-items:center;
    justify-content:center;
    user-select:none;
    -webkit-user-select:none;
    touch-action:manipulation;
    backdrop-filter:blur(3px);
    z-index:6;
  }
  .tbtn:active{ background:rgba(255,255,255,.26); transform:scale(.92); }
  #leftBtn{ left:calc(14px + env(safe-area-inset-left,0px)); }
  #rightBtn{ left:calc(70px + env(safe-area-inset-left,0px)); }
  #jumpBtn{
    right:calc(16px + env(safe-area-inset-right,0px));
    width:60px;
    height:60px;
    font-size:1.2rem;
    background:rgba(255,203,71,.15);
    border-color:rgba(255,203,71,.45);
  }

  #winOverlay{
    position:fixed; inset:0;
    background:rgba(18,12,32,.94);
    display:none;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    z-index:10;
    padding:24px;
    text-align:center;
  }
  #winOverlay.show{ display:flex; }

  svg#flower{ width:140px; height:180px; overflow:visible; }
  .stem{
    stroke:#5a9e5e; stroke-width:7; fill:none; stroke-linecap:round;
    stroke-dasharray:150; stroke-dashoffset:150;
    animation:growStem 1s ease forwards;
  }
  .leaf{
    fill:#5a9e5e; opacity:0;
    animation:popCenter .5s ease forwards;
    animation-delay:.7s;
  }
  .petal{
    fill:var(--petal);
    transform-origin:70px 92px;
    opacity:0;
    animation:popPetal .45s ease forwards;
  }
  .fcenter{ fill:#7a4a1e; opacity:0; animation:popCenter .4s ease forwards; animation-delay:1.7s; }
  .fdots{ fill:#5a3414; opacity:0; animation:popCenter .4s ease forwards; animation-delay:1.9s; }

  @keyframes growStem{ to{ stroke-dashoffset:0; } }
  @keyframes popPetal{ from{ opacity:0; transform:scale(0) rotate(var(--r)); } to{ opacity:1; transform:scale(1) rotate(var(--r)); } }
  @keyframes popCenter{ to{ opacity:1; } }

  #loveText{
    font-size:1.7rem;
    margin-top:10px;
    opacity:0;
    letter-spacing:1px;
    animation:fadeUp .8s ease forwards;
    animation-delay:2.1s;
  }
  @keyframes fadeUp{ from{ opacity:0; transform:translateY(10px); } to{ opacity:1; transform:translateY(0); } }

  #photoFrame{
    margin-top:22px;
    background:#fffaf0;
    padding:10px 10px 34px;
    border-radius:4px;
    transform:rotate(-3deg) scale(.9);
    opacity:0;
    box-shadow:0 12px 34px rgba(0,0,0,.5);
    animation:photoIn .7s ease forwards;
    animation-delay:2.8s;
    max-width:260px;
    width:80%;
  }
  @keyframes photoIn{ to{ opacity:1; transform:rotate(-3deg) scale(1); } }
  #photoFrame img{ width:100%; display:block; border-radius:2px; }
  #photoFrame .cap{
    color:#4a3a2a;
    font-size:.75rem;
    margin-top:10px;
    text-align:center;
    font-family:'Courier New', monospace;
  }
  #photoMissing{
    display:none;
    color:#4a3a2a;
    font-size:.7rem;
    line-height:1.5;
    max-width:220px;
  }

  #retryBtn{
    margin-top:24px;
    background:var(--sun);
    color:#3a2a00;
    border:none;
    padding:11px 24px;
    border-radius:22px;
    font-family:inherit;
    font-weight:bold;
    cursor:pointer;
    opacity:0;
    animation:fadeUp .6s ease forwards;
    animation-delay:3.3s;
  }
  #retryBtn:active{ transform:scale(.97); }
</style>
</head>
<body>

  <h1>Uma pequena jornada até você</h1>
  <div id="subtitle">desvie dos espinhos e chegue até o girassol 🌻 · pulo duplo liberado</div>

  <div id="gameWrap">
    <canvas id="game" width="800" height="400"></canvas>
  </div>
  <div id="hearts"></div>

  <div id="touchControls">
    <div id="dpad">
      <div class="tbtn" id="leftBtn">◀</div>
      <div class="tbtn" id="rightBtn">▶</div>
    </div>
    <div class="tbtn" id="jumpBtn">▲</div>
  </div>

  <div id="winOverlay">
    <svg id="flower" viewBox="0 0 140 200">
      <path class="stem" d="M70 195 C 65 150, 75 120, 70 92" />
      <path class="leaf" d="M70 150 C 40 145, 30 165, 20 175 C 45 178, 62 168, 70 150 Z" />
      <path class="leaf" d="M70 130 C 100 122, 112 140, 122 148 C 96 155, 78 148, 70 130 Z" style="animation-delay:.85s" />

      <g>
        <ellipse class="petal" cx="70" cy="60" rx="11" ry="24" style="--r:0deg; animation-delay:1.0s"/>
        <ellipse class="petal" cx="70" cy="60" rx="11" ry="24" style="--r:45deg; animation-delay:1.05s"/>
        <ellipse class="petal" cx="70" cy="60" rx="11" ry="24" style="--r:90deg; animation-delay:1.1s"/>
        <ellipse class="petal" cx="70" cy="60" rx="11" ry="24" style="--r:135deg; animation-delay:1.15s"/>
        <ellipse class="petal" cx="70" cy="60" rx="11" ry="24" style="--r:180deg; animation-delay:1.2s"/>
        <ellipse class="petal" cx="70" cy="60" rx="11" ry="24" style="--r:225deg; animation-delay:1.25s"/>
        <ellipse class="petal" cx="70" cy="60" rx="11" ry="24" style="--r:270deg; animation-delay:1.3s"/>
        <ellipse class="petal" cx="70" cy="60" rx="11" ry="24" style="--r:315deg; animation-delay:1.35s"/>
      </g>
      <circle class="fcenter" cx="70" cy="92" r="20"/>
      <circle class="fdots" cx="63" cy="86" r="1.6"/>
      <circle class="fdots" cx="70" cy="84" r="1.6"/>
      <circle class="fdots" cx="77" cy="87" r="1.6"/>
      <circle class="fdots" cx="65" cy="93" r="1.6"/>
      <circle class="fdots" cx="73" cy="94" r="1.6"/>
      <circle class="fdots" cx="79" cy="95" r="1.6"/>
    </svg>

    <div id="loveText">Amo você mais que todos os raios de sol que cruzam o céu e te iluminam 💛</div>

    <div id="photoFrame">
      <img id="pic" src="nos.png" alt="a gente"
           onerror="this.style.display='none'; document.getElementById('photoMissing').style.display='block';">
      <div id="photoMissing">
        📷 coloque uma foto chamada <b>nos.png</b> na mesma pasta deste arquivo pra ela aparecer aqui
      </div>
      <div class="cap">a gente 💛</div>
    </div>

    <button id="retryBtn">jogar de novo</button>
  </div>

<script>
(function(){
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  const GROUND_Y = 340;
  const GRAVITY = 0.52;
  const MOVE_SPEED = 4.2;
  const JUMP_VELOCITY = -11.6;
  const DOUBLE_JUMP_VELOCITY = -10.2;
  const MAX_JUMPS = 2;
  const COYOTE_MS = 120;
  const JUMP_BUFFER_MS = 150;
  const WORLD_WIDTH = 3400;

  // ---- level data ----
  const platforms = [
    {x:0,    y:GROUND_Y, w:500,  h:60, type:'ground'},
    {x:620,  y:GROUND_Y, w:330,  h:60, type:'ground'},
    {x:1050, y:260,       w:150, h:20, type:'float'},
    {x:1300, y:200,       w:150, h:20, type:'float'},
    {x:1500, y:GROUND_Y, w:350,  h:60, type:'ground'},
    {x:2200, y:GROUND_Y, w:400,  h:60, type:'ground'},
    {x:2680, y:GROUND_Y, w:720,  h:60, type:'ground'}
  ];

  const spikes = [
    {x:760,  y:GROUND_Y-18, w:40, h:18},
    {x:1650, y:GROUND_Y-18, w:40, h:18},
    {x:2380, y:GROUND_Y-18, w:40, h:18}
  ];

  const movingPlatform = { baseX:1950, y:280, w:120, h:20, amp:100, speed:0.0016, x:1950 };

  const goal = { x:3300, y:GROUND_Y-70, w:50, h:70 };

  const checkpointsRef = platforms.filter(p => p.type === 'ground').map(p => ({x:p.x+30, y:p.y}));

  // ---- player ----
  const player = {
    x:40, y:GROUND_Y-30, w:26, h:30,
    vx:0, vy:0, onGround:false, facing:1, animT:0, jumpsUsed:0
  };
  let checkpoint = {x:40, y:GROUND_Y-30};

  let cameraX = 0;
  let won = false;
  let keys = {left:false, right:false, jump:false};
  let jumpHeld = false;
  let lastGroundedAt = 0;
  let jumpBufferedAt = -9999;

  function doJump(t, strong){
    player.vy = strong ? JUMP_VELOCITY : DOUBLE_JUMP_VELOCITY;
    player.onGround = false;
    player.jumpsUsed++;
    jumpBufferedAt = -9999;
  }

  function allPlatforms(t){
    const mp = {x:movingPlatform.x, y:movingPlatform.y, w:movingPlatform.w, h:movingPlatform.h, type:'float'};
    return platforms.concat([mp]);
  }

  function rectsOverlap(a,b){
    return a.x < b.x+b.w && a.x+a.w > b.x && a.y < b.y+b.h && a.y+a.h > b.y;
  }

  function resetPlayer(){
    player.x = checkpoint.x;
    player.y = checkpoint.y;
    player.vx = 0; player.vy = 0;
    player.jumpsUsed = 0;
    player.onGround = true;
    lastGroundedAt = 0;
    jumpBufferedAt = -9999;
  }

  function die(){
    resetPlayer();
  }

  function update(t){
    if (won) return;

    movingPlatform.x = movingPlatform.baseX + Math.sin(t*movingPlatform.speed)*movingPlatform.amp;

    // horizontal movement (full speed even mid-air, so moving + jumping never fight each other)
    player.vx = 0;
    if (keys.left){ player.vx = -MOVE_SPEED; player.facing = -1; }
    if (keys.right){ player.vx = MOVE_SPEED; player.facing = 1; }

    // jump input: edge-triggered, remembers a recent press (buffer) and a recent ledge (coyote time)
    const jumpPressedEdge = keys.jump && !jumpHeld;
    jumpHeld = keys.jump;
    if (jumpPressedEdge) jumpBufferedAt = t;

    const withinCoyote = (t - lastGroundedAt) < COYOTE_MS;
    const canGroundJump = player.jumpsUsed === 0 && (player.onGround || withinCoyote);
    const canAirJump = player.jumpsUsed >= 1 && player.jumpsUsed < MAX_JUMPS;
    const hasBufferedJump = (t - jumpBufferedAt) < JUMP_BUFFER_MS;

    if (hasBufferedJump && canGroundJump){
      doJump(t, true);
    } else if (jumpPressedEdge && canAirJump){
      doJump(t, false);
    }

    player.vy += GRAVITY;
    if (player.vy > 15) player.vy = 15;

    // move X then resolve collisions on X (simple - platforms are only walked on top, no side walls needed for this level)
    player.x += player.vx;
    if (player.x < 0) player.x = 0;

    // move Y then resolve collision with platform tops
    player.y += player.vy;
    player.onGround = false;

    const plats = allPlatforms();
    for (const p of plats){
      const feetPrevY = player.y - player.vy + player.h;
      const withinX = player.x + player.w > p.x && player.x < p.x + p.w;
      if (withinX && player.vy >= 0 && feetPrevY <= p.y + 1 && player.y + player.h >= p.y && player.y + player.h <= p.y + p.h + 14){
        player.y = p.y - player.h;
        player.vy = 0;
        player.onGround = true;
        player.jumpsUsed = 0;
        lastGroundedAt = t;
        if (p.type === 'ground'){
          for (const cp of checkpointsRef){
            if (p.x + 30 > checkpoint.x - 1 && Math.abs((p.x+30) - cp.x) < 1 && p.x < player.x + 200){
              checkpoint = {x: Math.max(checkpoint.x, p.x+30), y: p.y-player.h};
            }
          }
        }
      }
    }
    // fell into a pit
    if (player.y > H + 60){
      die();
    }

    // spikes
    for (const s of spikes){
      if (rectsOverlap(player, s)){
        die();
      }
    }

    // goal
    if (rectsOverlap(player, goal)){
      triggerWin();
    }

    player.animT += Math.abs(player.vx) > 0 ? 1 : 0;

    // camera
    cameraX = player.x - 300;
    if (cameraX < 0) cameraX = 0;
    if (cameraX > WORLD_WIDTH - W) cameraX = WORLD_WIDTH - W;
  }

  function drawBackground(t){
    const grad = ctx.createLinearGradient(0,0,0,H);
    grad.addColorStop(0, '#241a3d');
    grad.addColorStop(.55, '#4b3576');
    grad.addColorStop(1, '#8b5fa8');
    ctx.fillStyle = grad;
    ctx.fillRect(0,0,W,H);

    // stars
    ctx.fillStyle = 'rgba(255,255,255,.5)';
    for (let i=0;i<40;i++){
      const sx = (i*137 - cameraX*0.15) % W;
      const sy = (i*53) % (H*0.5);
      ctx.globalAlpha = 0.3 + 0.3*Math.sin(t*0.001 + i);
      ctx.fillRect((sx+W)%W, sy, 2, 2);
    }
    ctx.globalAlpha = 1;

    // distant hills (parallax)
    ctx.fillStyle = '#3a2a5c';
    for (let i=-1;i<6;i++){
      const hx = i*400 - (cameraX*0.3)%400;
      ctx.beginPath();
      ctx.ellipse(hx+200, H-10, 260, 90, 0, Math.PI, 0, true);
      ctx.fill();
    }
  }

  function drawGround(p){
    const sx = p.x - cameraX;
    if (sx + p.w < 0 || sx > W) return;
    if (p.type === 'ground'){
      ctx.fillStyle = '#6b4a34';
      ctx.fillRect(sx, p.y, p.w, H - p.y);
      ctx.fillStyle = '#4a7c59';
      ctx.fillRect(sx, p.y, p.w, 12);
      ctx.fillStyle = '#5f9a6e';
      for (let gx=0; gx<p.w; gx+=18){
        ctx.fillRect(sx+gx+4, p.y-6, 4, 8);
      }
    } else {
      ctx.fillStyle = '#5f9a6e';
      ctx.fillRect(sx, p.y, p.w, p.h);
      ctx.fillStyle = '#3f6b4a';
      ctx.fillRect(sx, p.y+p.h-4, p.w, 4);
    }
  }

  function drawSpike(s){
    const sx = s.x - cameraX;
    if (sx + s.w < 0 || sx > W) return;
    ctx.fillStyle = '#e0553e';
    const teeth = 3;
    const tw = s.w/teeth;
    for (let i=0;i<teeth;i++){
      ctx.beginPath();
      ctx.moveTo(sx+i*tw, s.y+s.h);
      ctx.lineTo(sx+i*tw+tw/2, s.y);
      ctx.lineTo(sx+i*tw+tw, s.y+s.h);
      ctx.closePath();
      ctx.fill();
    }
  }

  function drawGoal(t){
    const sx = goal.x - cameraX;
    if (sx + goal.w < -50 || sx > W+50) return;
    // stem
    ctx.strokeStyle = '#5a9e5e';
    ctx.lineWidth = 6;
    ctx.beginPath();
    ctx.moveTo(sx+25, goal.y+70);
    ctx.lineTo(sx+25, goal.y+15);
    ctx.stroke();
    // petals
    const bob = Math.sin(t*0.003)*3;
    ctx.save();
    ctx.translate(sx+25, goal.y+10+bob);
    ctx.fillStyle = '#f4a300';
    for (let i=0;i<8;i++){
      ctx.save();
      ctx.rotate((Math.PI*2/8)*i);
      ctx.beginPath();
      ctx.ellipse(0,-14,7,14,0,0,Math.PI*2);
      ctx.fill();
      ctx.restore();
    }
    ctx.fillStyle = '#7a4a1e';
    ctx.beginPath();
    ctx.arc(0,0,11,0,Math.PI*2);
    ctx.fill();
    ctx.restore();
  }

  function drawPlayer(){
    const sx = player.x - cameraX;
    const bob = player.onGround ? Math.abs(Math.sin(player.animT*0.25))*3 : 0;
    ctx.save();
    ctx.translate(sx + player.w/2, player.y + player.h - bob);

    // legs
    ctx.fillStyle = '#c9456a';
    const legOffset = player.onGround ? Math.sin(player.animT*0.4)*4 : 0;
    ctx.fillRect(-8+legOffset, -6, 5, 8);
    ctx.fillRect(3-legOffset, -6, 5, 8);

    // body
    ctx.fillStyle = '#ff8fab';
    ctx.beginPath();
    ctx.ellipse(0, -22, 14, 16, 0, 0, Math.PI*2);
    ctx.fill();

    // cheeks
    ctx.fillStyle = 'rgba(255,255,255,.55)';
    ctx.beginPath();
    ctx.arc(-7*player.facing, -19, 2.6, 0, Math.PI*2);
    ctx.fill();

    // eyes
    ctx.fillStyle = '#3a2233';
    ctx.beginPath();
    ctx.arc(3*player.facing+2, -25, 2.1, 0, Math.PI*2);
    ctx.arc(9*player.facing+2, -25, 2.1, 0, Math.PI*2);
    ctx.fill();

    // little leaf on head
    ctx.fillStyle = '#5a9e5e';
    ctx.beginPath();
    ctx.ellipse(2, -38, 5, 8, -0.4, 0, Math.PI*2);
    ctx.fill();

    ctx.restore();
  }

  function draw(t){
    drawBackground(t);
    for (const p of platforms) drawGround(p);
    drawGround({x:movingPlatform.x, y:movingPlatform.y, w:movingPlatform.w, h:movingPlatform.h, type:'float'});
    for (const s of spikes) drawSpike(s);
    drawGoal(t);
    drawPlayer();
  }

  let heartsToggle = 0;
  function loop(t){
    update(t);
    draw(t);
    if (!won){
      requestAnimationFrame(loop);
    }
  }

  function triggerWin(){
    if (won) return;
    won = true;
    document.getElementById('winOverlay').classList.add('show');
  }

  function fullReset(){
    won = false;
    checkpoint = {x:40, y:GROUND_Y-30};
    resetPlayer();
    document.getElementById('winOverlay').classList.remove('show');
    requestAnimationFrame(loop);
  }

  // ---- input ----
  window.addEventListener('keydown', (e)=>{
    if (['ArrowLeft','a','A'].includes(e.key)) keys.left = true;
    if (['ArrowRight','d','D'].includes(e.key)) keys.right = true;
    if (['ArrowUp','w','W',' '].includes(e.key)){ keys.jump = true; e.preventDefault(); }
  });
  window.addEventListener('keyup', (e)=>{
    if (['ArrowLeft','a','A'].includes(e.key)) keys.left = false;
    if (['ArrowRight','d','D'].includes(e.key)) keys.right = false;
    if (['ArrowUp','w','W',' '].includes(e.key)) keys.jump = false;
  });

  function bindTouch(id, onDown, onUp){
    const el = document.getElementById(id);
    el.addEventListener('touchstart', (e)=>{ e.preventDefault(); onDown(); });
    el.addEventListener('touchend', (e)=>{ e.preventDefault(); onUp(); });
    el.addEventListener('mousedown', onDown);
    el.addEventListener('mouseup', onUp);
    el.addEventListener('mouseleave', onUp);
  }
  bindTouch('leftBtn', ()=>keys.left=true, ()=>keys.left=false);
  bindTouch('rightBtn', ()=>keys.right=true, ()=>keys.right=false);
  bindTouch('jumpBtn', ()=>keys.jump=true, ()=>keys.jump=false);

  document.getElementById('retryBtn').addEventListener('click', fullReset);

  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
